# netlib на homelab: nginx віддає docs/ і проксіює /api/gh/ у GitHub з токеном.
# Порт слухає тільки localhost, назовні сайт виходить через cloudflared + Cloudflare Access.
services:
  netlib:
    image: nginx:1.27-alpine
    container_name: netlib
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ../docs:/usr/share/nginx/html:ro
      - ./nginx/netlib.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/github-token.conf:/etc/nginx/secrets/github-token.conf:ro
