server {
    listen 80;
    server_name netlib.havinson.com;
    root /usr/share/nginx/html;

    # Системний DNS для proxy_pass з рантайм-резолвом (Docker embedded DNS).
    resolver 127.0.0.11 valid=300s ipv6=off;

    # Оболонка PWA: браузер завжди перевіряє свіжість, інакше оновлення не доїдуть.
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /index.html           { add_header Cache-Control "no-cache"; }
    location = /app.js               { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }
    location / { try_files $uri $uri/ /index.html; }

    # Проксі в GitHub API. Дозволено ТІЛЬКИ репозиторій з шаблонами,
    # тож навіть з валідною сесією через нього не можна лазити по інших репо.
    # Репозиторій: maskhav/netlib.
    location ~ ^/api/gh/(repos/maskhav/netlib(/.*)?)$ {
        limit_except GET PUT { deny all; }
        set $gh_path $1;
        proxy_pass https://api.github.com/$gh_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "netlib-proxy";
        include /etc/nginx/secrets/github-token.conf;
        # Не віддаємо в GitHub кукі й заголовки Cloudflare
        proxy_set_header Cookie "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header X-Forwarded-For "";
        client_max_body_size 2m;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 403; }
}
